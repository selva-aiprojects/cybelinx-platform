server:
  port: ${API_PORT:3001}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: central-api
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        type:
          json_format_mapper: org.hibernate.type.format.jackson.JacksonJsonFormatMapper
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  web:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

springdoc:
  swagger-ui:
    path: /docs

cybelinx:
  idp:
    provider: ${IDP_PROVIDER:generic}
    issuer: ${IDP_ISSUER:}
    audience: ${IDP_AUDIENCE:}
    jwt-secret: ${IDP_JWT_SECRET:}
    jwks-uri: ${IDP_JWKS_URI:}
    jwt-clock-skew-seconds: ${IDP_JWT_CLOCK_SKEW_SECONDS:0}