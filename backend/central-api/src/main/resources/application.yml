server:
  port: ${API_PORT:3001}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: central-api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        type:
          json_format_mapper: org.hibernate.type.format.jackson.JacksonJsonFormatMapper
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  web:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

springdoc:
  swagger-ui:
    path: /docs

cybelinx:
  idp:
    provider: ${IDP_PROVIDER:supabase}
    issuer: ${IDP_ISSUER:${SUPABASE_URL:}/auth/v1}
    audience: ${IDP_AUDIENCE:authenticated}
    jwt-secret: ${IDP_JWT_SECRET:}
    jwks-uri: ${IDP_JWKS_URI:${SUPABASE_JWKS_URL:}}
    jwt-clock-skew-seconds: ${IDP_JWT_CLOCK_SKEW_SECONDS:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}