name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  java-backend:
    name: Backend · Java 21 · Maven Test & JaCoCo Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cybelinx
          POSTGRES_PASSWORD: cybelinx_dev_password
          POSTGRES_DB: cybelinx_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybelinx -d cybelinx_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cybelinx_platform
      SPRING_DATASOURCE_USERNAME: cybelinx
      SPRING_DATASOURCE_PASSWORD: cybelinx_dev_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests with JaCoCo coverage
        run: ./backend/mvnw -f backend/pom.xml test jacoco:report

      - name: Upload Coverage Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/central-api/target/site/jacoco/

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Central API Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/central-api/Dockerfile
          push: false

      - name: Build Event Worker Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/event-worker/Dockerfile
          push: false

  admin-portal:
    name: Admin Portal · Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_VERSION: "24"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test