# =====================================================================
# Render Blueprint — Cybelinx Platform
# https://render.com/docs/blueprint-spec
# =====================================================================

services:
  # -------------------------------------------------------------------
  # Central API — Spring Boot 3 / Java 21 Control Plane
  # -------------------------------------------------------------------
  - type: web
    name: cybelinx-central-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.central-api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/actuator/health

    envVars:
      # Server
      - key: API_PORT
        value: "3001"

      # ── Aiven PostgreSQL ──────────────────────────────────────────
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://pg-jioclinic-aiservices-selva.f.aivencloud.com:19168/cybelinx-platform?sslmode=require"
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # Set in Render dashboard (Aiven DB password)

      # ── CORS (allow Vercel + local dev) ───────────────────────────
      - key: CORS_ORIGINS
        value: "https://cybelinx-platform.vercel.app,http://localhost:3000"

      # ── Identity Provider (Supabase JWT) ──────────────────────────
      - key: IDP_PROVIDER
        value: supabase
      - key: IDP_ISSUER
        value: "https://uvddwyfcqdxuvssunuby.supabase.co/auth/v1"
      - key: IDP_AUDIENCE
        value: authenticated
      - key: IDP_JWKS_URI
        value: "https://uvddwyfcqdxuvssunuby.supabase.co/auth/v1/.well-known/jwks.json"
      - key: IDP_JWT_SECRET
        sync: false   # Set in Render dashboard (Supabase JWT secret)
      - key: IDP_JWT_CLOCK_SKEW_SECONDS
        value: "30"

      # ── JVM tuning for free-tier memory limits ────────────────────
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m -XX:+UseContainerSupport"
